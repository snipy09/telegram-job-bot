name: 24x7 Job & Internship Broadcaster

on:
  schedule:
    # Runs every 15 minutes automatically 24x7
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper & Broadcast to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8693427934:AAE5wFzwl-02uojLpnmFz9YLUW-KWGCHgrU' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@theflashjobupdates' }}
          ALERT_CHECK_INTERVAL_MINUTES: "2"
          MAX_JOB_AGE_HOURS: "2"
        run: |
          python cron_runner.py
