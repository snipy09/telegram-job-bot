name: 24x7 Job & Internship Broadcaster

on:
  schedule:
    # Auto-runs every 15 minutes 24x7 (Unlimited Free Execution on Public Repo)
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scraper & Broadcast to Telegram
        env:
          # Securely injected from GitHub Encrypted Repository Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          ALERT_CHECK_INTERVAL_MINUTES: "2"
          MAX_JOB_AGE_HOURS: "2"
        run: |
          python cron_runner.py
