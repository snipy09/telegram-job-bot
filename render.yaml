services:
  - type: web
    name: telegram-job-broadcaster
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python cloud_runner.py
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        value: "@theflashjobupdates"
      - key: ALERT_CHECK_INTERVAL_MINUTES
        value: "2"
      - key: CHANNEL_POST_INTERVAL_MINUTES
        value: "2"
      - key: MAX_JOB_AGE_HOURS
        value: "2"
